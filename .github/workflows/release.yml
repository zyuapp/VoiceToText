name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_release:
    runs-on: macos-15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      asset_name: ${{ steps.package.outputs.asset_name }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve tag and version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${TAG}" =~ ^v[0-9] ]]; then
            echo "Tag must start with v (example: v1.1)"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build whisper.cpp dependencies
        run: ./setup-whisper.sh

      - name: Build Release app
        run: xcodebuild -project VoiceToText.xcodeproj -scheme VoiceToText -configuration Release -derivedDataPath build clean build

      - name: Package release artifact
        id: package
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          ASSET_NAME="VoiceToText-v${VERSION}-macos-arm64.zip"
          APP_PATH="build/Build/Products/Release/VoiceToText.app"

          if [ ! -d "${APP_PATH}" ]; then
            echo "Built app not found at ${APP_PATH}"
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${ASSET_NAME}"
          SHA256="$(shasum -a 256 "${ASSET_NAME}" | awk '{print $1}')"

          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Create release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Install
          - Download the attached zip and move `VoiceToText.app` to `/Applications`.
          - Or install with Homebrew: `brew install --cask zyuapp/tap/voice-to-text`.

          ## Notes
          - This build is unsigned and not notarized, so macOS may show a security warning on first launch.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="VoiceToText v${{ steps.meta.outputs.version }}"
          ASSET_NAME="${{ steps.package.outputs.asset_name }}"

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSET_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --notes-file RELEASE_NOTES.md
          else
            gh release create "${TAG}" "${ASSET_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --notes-file RELEASE_NOTES.md
          fi

  update_homebrew_tap:
    runs-on: ubuntu-latest
    needs: build_release
    if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Clone tap repository
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: gh repo clone zyuapp/homebrew-tap tap

      - name: Update cask file
        run: |
          VERSION="${{ needs.build_release.outputs.version }}"
          SHA256="${{ needs.build_release.outputs.sha256 }}"

          mkdir -p tap/Casks

          cat > tap/Casks/voice-to-text.rb <<EOF
          cask "voice-to-text" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/zyuapp/VoiceToText/releases/download/v#{version}/VoiceToText-v#{version}-macos-arm64.zip",
                verified: "github.com/zyuapp/VoiceToText/"
            name "VoiceToText"
            desc "System-wide offline voice dictation for macOS"
            homepage "https://github.com/zyuapp/VoiceToText"

            depends_on arch: :arm64
            depends_on macos: ">= :sonoma"

            app "VoiceToText.app"

            zap trash: [
              "~/Library/Application Support/VoiceToText",
              "~/Library/Preferences/com.zyu.VoiceToText.plist",
            ]

            caveats <<~EOS
              This app is unsigned and not notarized, so macOS may show a security warning on first launch.
            EOS
          end
          EOF

      - name: Commit and push cask update
        run: |
          cd tap
          git add Casks/voice-to-text.rb

          if git diff --cached --quiet; then
            echo "No cask changes to commit"
            exit 0
          fi

          VERSION="${{ needs.build_release.outputs.version }}"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "voice-to-text ${VERSION}"
          git push
